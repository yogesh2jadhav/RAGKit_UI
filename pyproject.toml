[build-system]
requires = [
    "setuptools>=69",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "ragkit"
version = "0.1.0"
description = "A modular Retrieval-Augmented Generation framework"
requires-python = ">=3.12"

dependencies = [
    # API
    "fastapi",
    "uvicorn[standard]",

    # Data validation / models
    "pydantic",

    # Vector database
    "chromadb",

    # Ollama Python client
    "ollama",

    # Embeddings / ML
    "sentence-transformers",
    "torch",

    # Keyword retrieval
    "rank-bm25",

    # Document loading
    "python-docx",

    "python-multipart",
    "httpx2",
]


[project.optional-dependencies]

dev = [
    "pytest",
    "ruff",
]


[tool.setuptools.packages.find]
include = [
    "ragkit",
    "ragkit.*",
]
 

[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]


[tool.pytest.ini_options]
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:chromadb.telemetry.opentelemetry"
]
